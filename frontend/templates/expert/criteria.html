<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Criteria Management</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap');

        body { 
            background-color: #10002b; 
            font-family: 'Inter', sans-serif; 
            padding: 20px; 
            margin: 0;
        }

        .container { 
            max-width: 1100px; 
            margin: 0 auto; 
            background: white; 
            padding: 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        /* FIX 1: Responsive Wrapper to prevent horizontal overflow */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
            margin-top: 20px;
            border-radius: 8px;
            border: 1px solid #eee;
        }

        table { 
            width: 100%; 
            border-collapse: collapse; 
            table-layout: auto; /* Allows dynamic column resizing */
        }

        th { 
            background: #264653; 
            color: white; 
            padding: 15px 10px; 
            font-size: 0.85em;
            text-transform: uppercase;
            white-space: nowrap; /* Keeps headers on one line */
        }

        td { 
            padding: 12px 10px; 
            border-bottom: 1px solid #eee; 
            text-align: center; 
            vertical-align: middle;
        }

        /* FIX 2: Style for the Criterion Name (First Column) */
        .criterion-name {
            text-align: left !important;
            font-weight: 700;
            color: #264653;
            /* Force wrapping for long words */
            min-width: 150px;
            max-width: 250px; 
            word-wrap: break-word;
            overflow-wrap: break-word;
            white-space: normal; 
            line-height: 1.4;
        }

        .weight-input { 
            width: 55px; 
            text-align: center; 
            padding: 8px; 
            border: 1px solid #ddd; 
            border-radius: 5px;
            font-weight: bold;
            font-family: monospace;
        }

        .btn-save { 
            background: #2a9d8f; 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 5px; 
            cursor: pointer; 
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-save:hover { background: #21867a; transform: translateY(-2px); }

        .btn-delete {
            background: #e76f51;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
        }

        .form-section { 
            background: #f8f9fa; 
            padding: 25px; 
            border-radius: 12px; 
            margin-top: 40px; 
            border: 2px dashed #264653; 
        }

        .add-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin: 15px 0;
        }

        .spec-tag {
            font-size: 0.7em;
            font-weight: 800;
            display: block;
            margin-bottom: 5px;
            color: #264653;
        }

        h3 { color: #264653; border-left: 5px solid #2a9d8f; padding-left: 10px; margin-top: 30px;}
    </style>
</head>
<body>

<div class="container">
    <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #f0f2f5; padding-bottom: 15px; margin-bottom: 20px;">
        <h1 style="margin:0;"><i class="fas fa-tasks"></i> Criteria Management</h1>
        <div>
            <a href="/expert" class="btn" style="background:#6c757d; color:white; text-decoration:none; padding:10px 20px; border-radius:5px; font-weight:bold; margin-right:10px;">Back To Dashboard</a>
            <button class="btn-save" onclick="saveToServer()"><i class="fas fa-cloud-upload-alt"></i> Save Criteria</button>
        </div>
    </div>

    <div id="criteriaContainer"></div>

    <!-- Add New Section -->
    <div class="form-section">
        <h2 style="margin-top:0; color:#264653; font-size:1.2em;"><i class="fas fa-plus-circle"></i> Add New Subject/Skill</h2>
        <div style="display: flex; gap: 15px; margin-bottom: 15px;">
            <div style="flex: 1;">
                <label style="font-weight: bold; font-size: 0.8em;">Category</label>
                <select id="newCat" style="width:100%; padding:10px; border-radius:5px; border:1px solid #ddd;">
                    <option value="spm_results">SPM Results</option>
                    <option value="previous_semester">University Results</option>
                    <option value="technical_skills">Technical Skills</option>
                </select>
            </div>
            <div style="flex: 2;">
                <label style="font-weight: bold; font-size: 0.8em;">Criterion Name</label>
                <input type="text" id="newName" placeholder="Enter Full Subject Name" style="width:100%; padding:10px; border-radius:5px; border:1px solid #ddd; box-sizing: border-box;">
            </div>
        </div>
        
        <label style="font-weight: bold; font-size: 0.8em;">Target Specialization Weights (1-10)</label>
        <div class="add-grid">
            <div><span class="spec-tag">Cyber</span><input type="number" id="w_cyber" class="weight-input" value="5" min="1" max="10"></div>
            <div><span class="spec-tag">Cloud</span><input type="number" id="w_cloud" class="weight-input" value="5" min="1" max="10"></div>
            <div><span class="spec-tag">IDEX</span><input type="number" id="w_idex" class="weight-input" value="5" min="1" max="10"></div>
            <div><span class="spec-tag">Data</span><input type="number" id="w_data" class="weight-input" value="5" min="1" max="10"></div>
            <div><span class="spec-tag">Digital</span><input type="number" id="w_digital" class="weight-input" value="5" min="1" max="10"></div>
        </div>
        <button class="btn-save" style="width:100%;" onclick="addEntry()">Add to List</button>
    </div>
</div>

<!-- Hidden form for submission -->
<form id="saveForm" method="POST" style="display:none;">
    <input type="hidden" name="criteria_json" id="hiddenJSON">
</form>

<script>
    let criteriaConfig = {{ data['criteria'] | tojson }};
    const SPECS = ['CYBERSECURITY', 'CLOUD COMPUTING', 'IDEX', 'DATA ANALYTICS', 'DIGITAL TRANSFORMATION'];

    function render() {
        const container = document.getElementById('criteriaContainer');
        container.innerHTML = '';
        
        for (const [cat, items] of Object.entries(criteriaConfig)) {
            let catTitle = cat.replace('_', ' ').toUpperCase();
            let html = `<h3>${catTitle}</h3><div class="table-wrapper"><table><thead><tr>`;
            html += `<th style="text-align:left; width: 30%;">Criterion Name</th>`;
            SPECS.forEach(s => html += `<th>${s.split(' ')[0]}</th>`);
            html += `<th>Del</th></tr></thead><tbody>`;
            
            for (const [name, weights] of Object.entries(items)) {
                let displayName = name.replace(/_/g, ' ');
                html += `<tr><td class="criterion-name">${displayName}</td>`;
                SPECS.forEach(s => {
                    const val = weights[s] || 5;
                    html += `<td><input type="number" class="weight-input" value="${val}" onchange="updateWeight('${cat}','${name}','${s}',this.value)"></td>`;
                });
                html += `<td><button class="btn-delete" onclick="deleteEntry('${cat}','${name}')"><i class="fas fa-trash"></i></button></td></tr>`;
            }
            html += `</tbody></table></div>`;
            container.innerHTML += html;
        }
    }

    function updateWeight(cat, name, spec, val) {
        criteriaConfig[cat][name][spec] = parseInt(val);
    }
    
    function deleteEntry(cat, name) {
        if(confirm("Delete this criterion?")) {
            delete criteriaConfig[cat][name];
            render();
        }
    }

    function addEntry() {
        const cat = document.getElementById('newCat').value;
        const name = document.getElementById('newName').value.trim();
        if(!name) return alert("Please enter a name.");
        
        // Clean name for internal keys but preserve original for display in later renders
        const internalName = name.replace(/\s+/g, '_');
        
        criteriaConfig[cat][internalName] = {
            'CYBERSECURITY': parseInt(document.getElementById('w_cyber').value),
            'CLOUD COMPUTING': parseInt(document.getElementById('w_cloud').value),
            'IDEX': parseInt(document.getElementById('w_idex').value),
            'DATA ANALYTICS': parseInt(document.getElementById('w_data').value),
            'DIGITAL TRANSFORMATION': parseInt(document.getElementById('w_digital').value)
        };
        document.getElementById('newName').value = '';
        render();
    }

    function saveToServer() {
        document.getElementById('hiddenJSON').value = JSON.stringify(criteriaConfig);
        document.getElementById('saveForm').submit();
    }

    render();
</script>
</body>
</html>
