<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>RIASEC Calibration</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #10002b; font-family: 'Inter', sans-serif; padding: 20px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 15px; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #D34E4E; color: white; padding: 15px; }
        td { padding: 12px; border-bottom: 1px solid #eee; text-align: center; font-weight: bold; }
        .weight-input { width: 60px; padding: 8px; border-radius: 5px; border: 1px solid #ddd; text-align: center; }
        .btn-save { background: #D34E4E; color: white; border: none; padding: 12px 30px; border-radius: 5px; cursor: pointer; font-size: 1.1em; }
    </style>
</head>
<body>

<div class="container">
    <h1 style="text-align:center;"><i class="fas fa-brain"></i> New Faculty RIASEC Calibration</h1>
    <p style="text-align: center; color: #666;">Define the weight (0-10) of each personality trait for the 5 pathways.</p>
    
    <div style="text-align: center; margin-bottom: 20px;">
        <a href="/expert" class="btn" style="background:#6c757d; color:white; text-decoration:none; padding:10px 20px; border-radius:5px;">Back to Dashboard</a>
        <button class="btn-save" onclick="save()"><i class="fas fa-save"></i> Save Configuration</button>
    </div>

    <table>
        <thead>
            <tr>
                <th style="text-align: left;">Specialization</th>
                <th>R</th><th>I</th><th>A</th><th>S</th><th>E</th><th>C</th>
            </tr>
        </thead>
        <tbody id="riasecBody"></tbody>
    </table>
</div>

<form id="saveForm" method="POST" style="display:none;"><input type="hidden" name="riasec_json" id="hiddenJSON"></form>

<script>
    const riasecData = {{ data['riasec_weights'] | tojson }};
    const SPECS = ['CYBERSECURITY', 'CLOUD COMPUTING', 'IDEX', 'DATA ANALYTICS', 'DIGITAL TRANSFORMATION'];
    const TRAITS = ['R', 'I', 'A', 'S', 'E', 'C'];

    function render() {
        const body = document.getElementById('riasecBody');
        body.innerHTML = '';
        SPECS.forEach(s => {
            let row = `<tr><td style="text-align: left; color: #D34E4E;">${s}</td>`;
            TRAITS.forEach(t => {
                const val = (riasecData[s] && riasecData[s][t] !== undefined) ? riasecData[s][t] : 5;
                row += `<td><input type="number" class="weight-input" min="0" max="10" value="${val}" onchange="update('${s}','${t}',this.value)"></td>`;
            });
            row += `</tr>`;
            body.innerHTML += row;
        });
    }

    function update(spec, trait, val) {
        if(!riasecData[spec]) riasecData[spec] = {};
        riasecData[spec][trait] = parseInt(val);
    }

    function save() {
        document.getElementById('hiddenJSON').value = JSON.stringify(riasecData);
        document.getElementById('saveForm').submit();
    }

    render();
</script>
</body>
</html>
